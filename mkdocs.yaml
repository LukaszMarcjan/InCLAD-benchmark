site_name: InCLAD-Bench Documentation
theme:
  name: material
  highlightjs: true
  features:
    - navigation.expand
    - content.code.copy
nav:
  - InCLAD-Bench dataset: 'inclad-bench-dataset.md'
  - InCLAD-MD dataset: 'inclad-md-dataset.md'
  - Baselines:
    - UCAD: 'ucad.md'
    - CDAD (One-for-More): 'one-for-more.md'
    - ReplayCAD: 'replaycad.md'
plugins:
  - search
  - mkdocstrings:
      handlers:
        # See: https://mkdocstrings.github.io/python/usage/
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_submodules: true
markdown_extensions:
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - markdown_include.include:
      base_path: .
  - admonition: {}
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
